name: Python package
on:
  push:
    branches: [ master ]
    tags: '*'
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    # Example manual run (ad-hoc 3.15 test):
    # gh workflow run python-package.yml --repo nion-software/nionutils --ref master -f "python_versions=['3.15.0-rc.2']"
    inputs:
      python_versions:
        description: Python versions matrix JSON (for example ['3.12', '3.13', '3.14', '3.14t'])
        required: false
        type: string
        default: "['3.12', '3.13', '3.14', '3.14t']"
jobs:
  build-python-package:
    uses: nion-software/github-workflows/.github/workflows/build-python-package.yml@main
    with:
      python-versions: ${{ github.event_name == 'workflow_dispatch' && inputs.python_versions || "['3.12', '3.13', '3.14', '3.14t']" }}
  pypi-publish:
    name: Upload release to PyPI
    needs: [build-python-package]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags')
    environment: release
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
    - name: Download All Artifacts
      uses: actions/download-artifact@v4
    - name: Copy files to upload to PyPI to dist.
      shell: bash
      run: |
        mkdir dist
        find . -name "*.whl" -exec cp {} dist \;
        find . -name "*.tar.gz" -exec cp {} dist \;
        ls -lR .
    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip-existing: true
        print-hash: true
